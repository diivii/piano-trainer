<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Klaviertrainer</title>
  <link id="app-css" rel="stylesheet">
  <script>
    // Show startup problems on the page itself (there's no console on the iPad).
    (() => {
      const problems = [];
      const render = () => {
        const box = document.getElementById('startup-error');
        if (!box || !problems.length) return;
        box.textContent = problems.join('\n');
        box.hidden = false;
      };
      window.showStartupError = (text) => {
        problems.push(text);
        render();
      };
      window.addEventListener('error', (e) => {
        // Web MIDI Browser's add-on calls its own _callback_* functions from the
        // app; messages arriving before it has set them up fail harmlessly.
        // Counted for the connection dialog instead of shown here.
        if (/_callback_/.test(e.message || '')) {
          window.__midiCallbackErrors = (window.__midiCallbackErrors || 0) + 1;
          e.preventDefault();
          return;
        }
        if (e.message) showStartupError(`Fehler: ${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`);
      });
      window.addEventListener('unhandledrejection', (e) => showStartupError(`Fehler: ${e.reason?.message || e.reason}`));
      window.addEventListener('DOMContentLoaded', render);
    })();
  </script>
</head>
<body>
  <div id="startup-error" class="startup-error" hidden></div>
  <div id="app"></div>

  <script>
    // Bootstrap. This page stays small and rarely changes; everything else is
    // loaded with the current version in its address, so browsers can't keep
    // using an outdated copy. version.json is written when the site is
    // published (tools/stamp_version.py); locally it doesn't exist and files
    // load without a version.
    (async () => {
      if (location.protocol === 'file:') {
        showStartupError('Diese Seite wurde als Datei geöffnet. Starte sie mit start-server.cmd und öffne http://localhost:8000.');
        return;
      }
      const load = (src, attrs = {}) => new Promise((resolve, reject) => {
        const script = Object.assign(document.createElement('script'), { src, ...attrs });
        script.onload = resolve;
        script.onerror = () => reject(new Error(`${src} konnte nicht geladen werden`));
        document.body.append(script);
      });

      try {
        let version = '';
        try {
          const res = await fetch('version.json', { cache: 'no-store' });
          if (res.ok) version = (await res.json()).version || '';
        } catch {
          // no version: load files as they are
        }
        const v = version ? `?v=${version}` : '';
        window.appVersion = version || 'lokal';

        const css = document.getElementById('app-css');
        css.href = `css/style.css${v}`;
        const html = await fetch(`app.html${v}`, { cache: 'no-cache' });
        if (!html.ok) throw new Error(`app.html: ${html.status}`);
        document.getElementById('app').innerHTML = await html.text();

        // Sheet music library: changes only with its own version number.
        await load('vendor/opensheetmusicdisplay.min.js?v=2.2.1');
        await load(`js/main.js${v}`, { type: 'module' });
      } catch (err) {
        showStartupError(`Die App konnte nicht starten: ${err.message || err}. Bitte die Seite neu laden.`);
      }
    })();
  </script>
</body>
</html>
